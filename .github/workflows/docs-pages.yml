name: Publicar documentação no Pages
on:
  push:
    branches: ["login/prazo"]
    paths:
      [
        "website/**",
        "docs/**",
        "output/**",
        "GLOSSARY.md",
        "CHANGELOG.md",
        ".github/workflows/docs-*.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/login/prazo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm --prefix website ci --ignore-scripts
      - run: npm --prefix website test
      - run: npm --prefix website run build
      - run: npm --prefix website run verify:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
